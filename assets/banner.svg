<g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.14;0.6" calcMode="discrete"/><rect x="123" y="262" width="96" height="34" rx="17" fill="#2a1a52" stroke="#a66bff" stroke-width="2"/><text x="171" y="284" font-size="15" text-anchor="middle" fill="#ece6ff">focused</text></g>
<g><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;0;1" keyTimes="0;0.14;0.6" calcMode="discrete"/><rect x="229" y="262" width="64" height="34" rx="17" fill="#2a1a52" stroke="#a66bff" stroke-width="2"/><text x="261" y="284" font-size="15" text-anchor="middle" fill="#ece6ff">wild</text></g>
<g transform="translate(261 280)"><circle r="4" fill="none" stroke="#ece6ff" stroke-width="2" opacity="0"><animate attributeName="r" dur="10s" repeatCount="indefinite" values="4;4;20;4;4" keyTimes="0;0.6;0.645;0.65;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.599;0.6;0.645;1"/></circle></g>
<!-- Doto reacts -->
<g transform="translate(424 106)">
<circle r="46" fill="none" stroke="#ff6bd6" stroke-width="2" opacity="0"><animate attributeName="r" dur="10s" repeatCount="indefinite" values="46;46;86;46;46" keyTimes="0;0.61;0.69;0.695;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.7;0;0" keyTimes="0;0.609;0.61;0.69;1"/></circle>
<circle r="46" fill="none" stroke="#a66bff" stroke-width="2" opacity="0"><animate attributeName="r" dur="10s" repeatCount="indefinite" values="46;46;86;46;46" keyTimes="0;0.66;0.74;0.745;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.7;0;0" keyTimes="0;0.659;0.66;0.74;1"/></circle>
<g><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="0 0;0 0;0 -12;0 0;0 0;-8 -11;7 2;-6 -13;8 0;-7 -10;6 3;-5 -9;5 0;0 -5;0 0;0 0" keyTimes="0;0.465;0.485;0.505;0.61;0.625;0.64;0.655;0.67;0.685;0.7;0.715;0.73;0.75;0.78;1"/><g filter="url(#pb-glow)"><circle r="42" fill="url(#pb-orb)"/></g><circle cx="-12.92" cy="-14.54" r="10.5" fill="#fff" fill-opacity=".75"/><ellipse cx="-14.54" cy="4.04" rx="6.87" ry="6.87" fill="#120b1f"><animate attributeName="ry" dur="5s" begin="0s" repeatCount="indefinite" values="6.87;6.87;1.01;6.87;6.87" keyTimes="0;.56;.58;.6;1"/></ellipse><ellipse cx="14.54" cy="4.04" rx="6.87" ry="6.87" fill="#120b1f"><animate attributeName="ry" dur="5s" begin="0s" repeatCount="indefinite" values="6.87;6.87;1.01;6.87;6.87" keyTimes="0;.56;.58;.6;1"/></ellipse></g>
</g>
<!-- what the window tells Claude -->
