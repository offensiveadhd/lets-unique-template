<rect x="1" y="1" width="1278" height="398" rx="28" fill="none" stroke="#5a44a0" stroke-opacity=".65" stroke-width="2"/>
<circle cx="79" cy="75" r="6" fill="url(#pb-orb)"/>
<text class="m" x="96" y="81" font-size="18" letter-spacing=".6" fill="#a99cd0">lets-unique-template</text>
