<g transform="rotate(295.2 168 136)"><animateTransform attributeName="transform" type="rotate" dur="10s" repeatCount="indefinite" values="295.2 168 136;295.2 168 136;180 168 136;180 168 136;295.2 168 136;295.2 168 136" keyTimes="0;0.1;0.18;0.26;0.46;1"/><circle cx="168" cy="46" r="13" fill="#b98aff" stroke="#f6f2ff" stroke-width="3"/></g>
<text x="168" y="154" font-size="62" font-weight="800" text-anchor="middle" fill="#f1ebff" opacity="1"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;0;1" keyTimes="0;0.14;0.435" calcMode="discrete"/>82</text><text x="168" y="154" font-size="62" font-weight="800" text-anchor="middle" fill="#f1ebff" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.14;0.285" calcMode="discrete"/>50</text><text x="168" y="154" font-size="62" font-weight="800" text-anchor="middle" fill="#f1ebff" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.285;0.335" calcMode="discrete"/>58</text><text x="168" y="154" font-size="62" font-weight="800" text-anchor="middle" fill="#f1ebff" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.335;0.385" calcMode="discrete"/>66</text><text x="168" y="154" font-size="62" font-weight="800" text-anchor="middle" fill="#f1ebff" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.385;0.435" calcMode="discrete"/>74</text>
<text x="168" y="178" font-size="13.5" text-anchor="middle" fill="#a99cd0">drag the ring</text>
