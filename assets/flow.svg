<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="pf-t pf-d">
<title id="pf-t">How Claude drives pulse</title>
<desc id="pf-d">The pulse dial on the left, Claude on the right, two lanes between them. pulse.value goes up when you set the dial, and pulse.glow comes down as Claude acknowledges it with a glow on the ring. pulse.mode goes up when you pick a mode chip, and pulse.set comes down when Claude moves the dial itself. pulse.export goes up when you press Send to Claude, and on resume pulse.load comes down and the dial is back as you sent it. The session block names pulse.export as the export, pulse.snapshot as the snapshot and pulse.load as the restore.</desc>
