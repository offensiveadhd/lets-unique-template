<g opacity="1"><text x="40" y="300" font-size="22">You drag the dial. The settled value goes up.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.1458;.1583;.9833;.9958;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude answers with one line from Doto and a glow on the ring.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.1583;.1708;.3042;.3167;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">You pick a mode chip: calm, focused or wild.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.3167;.3292;.4625;.475;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude moves the dial itself, and says why.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.475;.4875;.6208;.6333;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Send to Claude: the engine saves the dial and the window closes.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6333;.6458;.7792;.7917;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22"><tspan class="m">/lets pulse resume</tspan>: the engine queues <tspan class="m">pulse.load</tspan> and the dial comes back as you sent it.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7917;.8042;.9583;.9708;1"/></g>
