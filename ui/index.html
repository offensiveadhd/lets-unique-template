<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse — a dial you talk through</title>
  <link rel="stylesheet" href="/sdk/lets-shell.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-unique="pulse">
  <main class="pulse-stage">
    <svg class="pulse-ring" viewBox="0 0 260 260" id="dial"
         role="slider" tabindex="0" aria-label="Mood dial, 0 to 100"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <circle class="focus-ring" cx="130" cy="130" r="122" />
      <circle class="track" cx="130" cy="130" r="104" />
      <circle class="arc" id="arc" cx="130" cy="130" r="104" />
      <circle class="knob" id="knob" cx="130" cy="26" r="11" />
      <text class="value" id="valueText" x="130" y="140" text-anchor="middle">50</text>
      <text class="hint" text-anchor="middle">
        <tspan x="130" y="164">drag the ring</tspan>
        <tspan x="130" y="181">or use the arrow keys</tspan>
      </text>
    </svg>
    <div class="controls">
      <div class="chips" id="chips" role="group" aria-label="Mode">
        <button type="button" class="chip" data-mode="calm" aria-pressed="false">calm</button>
        <button type="button" class="chip active" data-mode="focused" aria-pressed="true">focused</button>
        <button type="button" class="chip" data-mode="wild" aria-pressed="false">wild</button>
      </div>
      <button type="button" class="lets-btn lets-btn-primary" id="send">Send to Claude</button>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
