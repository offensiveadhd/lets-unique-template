<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="pulse">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2b1a52"/>
      <stop offset="1" stop-color="#120b1f"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#e3ccff"/>
      <stop offset=".45" stop-color="#a66bff"/>
      <stop offset="1" stop-color="#5a2fb0"/>
    </radialGradient>
    <radialGradient id="knob" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffd6f4"/>
      <stop offset=".45" stop-color="#ff6bd6"/>
      <stop offset="1" stop-color="#9b2d86"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c49bff"/>
      <stop offset="1" stop-color="#ff8fe0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#5a44a0" stroke-opacity=".6" stroke-width="1.5"/>
  <!-- the dial: a violet ring, set to about seventy -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#3a2a63" stroke-width="5"/>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="20" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="87.96 125.66" transform="rotate(-90 32 32)"/>
  </g>
  <!-- the knob you drag -->
  <g filter="url(#glow)">
    <circle cx="12.98" cy="38.18" r="4.6" fill="url(#knob)"/>
  </g>
  <circle cx="11.7" cy="36.7" r="1.2" fill="#fff" fill-opacity=".7"/>
  <!-- Doto, in the middle of it -->
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="8.5" fill="url(#orb)"/>
  </g>
  <circle cx="29.3" cy="29" r="2.1" fill="#fff" fill-opacity=".75"/>
  <circle cx="29" cy="32.8" r="1.3" fill="#120b1f"/>
  <circle cx="35" cy="32.8" r="1.3" fill="#120b1f"/>
</svg>
